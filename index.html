<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>⚽ Montúfar Zug Super Secret Album del Mundial</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase REST API Config
        const FIREBASE_DB_URL = "https://montefar-zug-album-default-rtdb.firebaseio.com";
        const FIREBASE_API_KEY = "AIzaSyDsSpB-cb8GfWvEJOmzM8XhBf-lblbu_bU";

        const GROUPS = {
            'FWC': { name: '⚽ World Cup History', teams: {} },
            'A': { name: 'GROUP A', teams: { 'MEX': 'Mexico', 'KOR': 'South Korea', 'RSA': 'South Africa', 'CZE': 'Czechia' } },
            'B': { name: 'GROUP B', teams: { 'CAN': 'Canada', 'SUI': 'Switzerland', 'QAT': 'Qatar','BIH': 'Bosnia and Herzegovina' } },
            'C': { name: 'GROUP C', teams: { 'BRA': 'Brazil', 'MAR': 'Morocco', 'SCO': 'Scotland', 'HAI': 'Haiti' } },
            'D': { name: 'GROUP D', teams: { 'USA': 'United States', 'AUS': 'Australia', 'PAR': 'Paraguay', 'TUR':'Turkey' } },
            'E': { name: 'GROUP E', teams: { 'GER': 'Germany', 'ECU': 'Ecuador', 'CIV': 'Ivory Coast', 'CUW': 'Curaçao' } },
            'F': { name: 'GROUP F', teams: { 'NED': 'Netherlands', 'JPN': 'Japan', 'TUN': 'Tunisia', 'SWE' : 'Sweden' } },
            'G': { name: 'GROUP G', teams: { 'BEL': 'Belgium', 'EGY': 'Egypt', 'IRN': 'Iran', 'NZL': 'New Zealand' } },
            'H': { name: 'GROUP H', teams: { 'ESP': 'Spain', 'URU': 'Uruguay', 'KSA': 'Saudi Arabia', 'CPV': 'Cape Verde' } },
            'I': { name: 'GROUP I', teams: { 'FRA': 'France', 'SEN': 'Senegal', 'NOR': 'Norway', 'IRQ': 'Iraq' } },
            'J': { name: 'GROUP J', teams: { 'ARG': 'Argentina', 'AUT': 'Austria', 'ALG': 'Algeria', 'JOR': 'Jordan' } },
            'K': { name: 'GROUP K', teams: { 'POR': 'Portugal', 'COL': 'Colombia', 'UZB': 'Uzbekistan', 'COD' : 'DR Congo' } },
            'L': { name: 'GROUP L', teams: { 'ENG': 'England', 'CRO': 'Croatia', 'GHA': 'Ghana', 'PAN': 'Panama' } },
        };

        function PaniniTracker() {
            const [stickers, setStickers] = useState({});
            const [searchTerm, setSearchTerm] = useState('');
            const [filterType, setFilterType] = useState('all');
            const [loading, setLoading] = useState(true);
            const [tradeMode, setTradeMode] = useState(false);
            const [tradeSearch, setTradeSearch] = useState('');
            const [syncing, setSyncing] = useState(false);
            const [lastSynced, setLastSynced] = useState(null);
            const [syncMessage, setSyncMessage] = useState('');
            const isInitializing = useRef(false);

            // Firebase REST API - PUSH to cloud
            const syncToCloud = async () => {
                setSyncing(true);
                setSyncMessage('');
                try {
                    const response = await fetch(
                        `${FIREBASE_DB_URL}/album/stickers.json?auth=${FIREBASE_API_KEY}`,
                        {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(stickers)
                        }
                    );
                    if (response.ok) {
                        setLastSynced(new Date());
                        setSyncMessage('✅ Synced to Cloud!');
                        setTimeout(() => setSyncMessage(''), 3000);
                    } else {
                        setSyncMessage('❌ Sync failed');
                    }
                } catch (error) {
                    setSyncMessage('❌ Error: ' + error.message);
                }
                setSyncing(false);
            };

            // Firebase REST API - PULL from cloud
            const loadFromCloud = async () => {
                setSyncing(true);
                setSyncMessage('');
                try {
                    const response = await fetch(
                        `${FIREBASE_DB_URL}/album/stickers.json?auth=${FIREBASE_API_KEY}`
                    );
                    if (response.ok) {
                        const data = await response.json();
                        if (data) {
                            setStickers(data);
                            localStorage.setItem('montefar_zug_album', JSON.stringify(data));
                            setLastSynced(new Date());
                            setSyncMessage('✅ Loaded from Cloud!');
                            setTimeout(() => setSyncMessage(''), 3000);
                        }
                    } else {
                        setSyncMessage('❌ Load failed');
                    }
                } catch (error) {
                    setSyncMessage('❌ Error: ' + error.message);
                }
                setSyncing(false);
            };

            // Initialize
            useEffect(() => {
                if (isInitializing.current) return;
                isInitializing.current = true;

                // Load from localStorage
                const saved = localStorage.getItem('montefar_zug_album');
                if (saved) {
                    try {
                        setStickers(JSON.parse(saved));
                    } catch {
                        initializeStickers();
                    }
                } else {
                    initializeStickers();
                }
                setLoading(false);
            }, []);

            // Save to localStorage automatically
            useEffect(() => {
                if (Object.keys(stickers).length === 0) return;
                localStorage.setItem('montefar_zug_album', JSON.stringify(stickers));
            }, [stickers]);

            const initializeStickers = () => {
                const newStickers = {};
                for (let i = 1; i <= 19; i++) {
                    newStickers[`FWC-${i}`] = 0;
                }
                Object.keys(GROUPS).forEach(groupKey => {
                    if (groupKey !== 'FWC') {
                        Object.keys(GROUPS[groupKey].teams).forEach(countryCode => {
                            for (let i = 1; i <= 20; i++) {
                                newStickers[`${countryCode}-${i}`] = 0;
                            }
                        });
                    }
                });
                setStickers(newStickers);
            };

            const incrementCount = (code) => {
                setStickers(prev => ({ ...prev, [code]: (prev[code] || 0) + 1 }));
            };

            const decrementCount = (code) => {
                setStickers(prev => ({ ...prev, [code]: Math.max(0, (prev[code] || 0) - 1) }));
            };

            const deleteStickerCount = (code) => {
                setStickers(prev => ({ ...prev, [code]: 0 }));
            };

            const allStickers = Object.keys(stickers).map(code => ({ code, count: stickers[code] }));
            
            const missing = allStickers.filter(s => s.count === 0).length;
            const have = allStickers.filter(s => s.count === 1).length;
            const forTrade = allStickers.filter(s => s.count >= 2).length;
            const total = allStickers.length;
            const percentage = total > 0 ? Math.round((have / total) * 100) : 0;

            const filtered = allStickers.filter(s => {
                const matchesSearch = s.code.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = filterType === 'all' || (filterType === 'have' && s.count === 1) || (filterType === 'trading' && s.count >= 2) || (filterType === 'missing' && s.count === 0);
                return matchesSearch && matchesFilter;
            });

            const getCountryName = (code) => {
                for (const groupKey of ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L']) {
                    if (GROUPS[groupKey].teams[code]) return GROUPS[groupKey].teams[code];
                }
                return 'World Cup';
            };

            const getStatusDisplay = (count) => {
                if (count === 0) return { label: 'Missing', icon: '', color: 'bg-slate-100 border-slate-300' };
                if (count === 1) return { label: 'Have', icon: '✓', color: 'bg-green-100 border-green-400' };
                return { label: `Have + Trade (${count - 1})`, icon: '✓↔', color: 'bg-purple-100 border-purple-400' };
            };

            const formatSyncTime = () => {
                if (!lastSynced) return 'Never';
                const now = new Date();
                const diff = Math.floor((now - lastSynced) / 1000);
                if (diff < 60) return 'Just now';
                if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
                return Math.floor(diff / 3600) + 'h ago';
            };

            const getStickerNumber = (code) => {
                return parseInt(code.split('-')[1]);
            };

            const copyMissingToClipboard = () => {
    const missing = allStickers.filter(s => s.count === 0);
    const grouped = {};

    // Group by country/team
    missing.forEach(sticker => {
        const countryCode = sticker.code.split('-')[0];
        if (!grouped[countryCode]) {
            grouped[countryCode] = [];
        }
        grouped[countryCode].push(getStickerNumber(sticker.code));
    });

    // Sort numbers within each group
    Object.keys(grouped).forEach(code => {
        grouped[code].sort((a, b) => a - b);
    });

    // Format as text with groups
    let text = "Missing Monti\n\n";
    
    // FWC first if exists
    if (grouped['FWC']) {
        text += "⚽ WORLD CUP HISTORY\n";
        text += "FWC: " + grouped['FWC'].join(", ") + "\n\n";
    }

    // Then groups A-L with their teams
    const groupOrder = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
    groupOrder.forEach(groupKey => {
        const groupTeams = Object.keys(GROUPS[groupKey].teams).filter(code => grouped[code]);
        if (groupTeams.length > 0) {
            text += "GROUP " + groupKey + "\n";
            groupTeams.forEach(countryCode => {
                text += countryCode + ": " + grouped[countryCode].join(", ") + "\n";
            });
            text += "\n";
        }
    });

    // Copy to clipboard
    navigator.clipboard.writeText(text).then(() => {
        setSyncMessage('✅ Copied to clipboard!');
        setTimeout(() => setSyncMessage(''), 3000);
    }).catch(() => {
        setSyncMessage('❌ Copy failed');
    });
};
            const syncToCloudWithWarning = async () => {
                const confirmed = window.confirm('🚨 JUST CHECKING: ARE YOU BEING STUPID? 🚨\n\nThis will ERASE everything on the cloud and replace it with YOUR data.\n\nIf your account is empty, everyone\'s stickers will be GONE!\n\nReally sync?');
                if (confirmed) {
                    await syncToCloud();
                }
            };

            const StickerCard = ({ sticker }) => {
                const st = getStatusDisplay(sticker.count);
                return (
                    <div
                        key={sticker.code}
                        className={`aspect-square rounded-lg border-2 cursor-pointer transition-all active:scale-95 flex flex-col items-center justify-center font-bold text-center ${st.color} hover:shadow-md relative`}
                    >
                        <div 
                            onClick={() => incrementCount(sticker.code)}
                            className="w-full h-full flex flex-col items-center justify-center"
                        >
                            <div className="text-xs">{sticker.code.split('-')[1]}</div>
                            {sticker.count > 0 && <>
                                <div className="text-sm">{st.icon}</div>
                                {sticker.count > 1 && <div className="text-xs bg-white rounded-full w-5 h-5 flex items-center justify-center">{sticker.count}</div>}
                            </>}
                        </div>
                        
                        {sticker.count > 0 && (
                            <button
                                onClick={(e) => { e.stopPropagation(); deleteStickerCount(sticker.code); }}
                                className="absolute top-0 right-0 text-xs bg-red-600 text-white rounded-bl px-1 py-0.5 hover:bg-red-700"
                            >
                                ✕
                            </button>
                        )}
                    </div>
                );
            };

            if (loading) {
                return <div className="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 flex items-center justify-center"><div className="animate-spin text-purple-600 text-4xl">⏳</div></div>;
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 pb-20">
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur border-b-2 border-purple-200 shadow-sm">
                        <div className="max-w-3xl mx-auto px-4 py-4">
                            <h1 className="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 mb-3">
                                🌍 Montúfar Zug Super Secret Album del Mundial
                            </h1>

                            {/* Sync Message */}
                            {syncMessage && (
                                <div className="mb-3 p-2 rounded-lg bg-blue-100 text-blue-800 text-sm font-semibold text-center">
                                    {syncMessage}
                                </div>
                            )}

                            {/* Sync Buttons */}
                            <div className="flex gap-2 mb-3">
                                <button 
                                    onClick={syncToCloudWithWarning}
                                    disabled={syncing}
                                    className="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:opacity-50 text-white font-bold py-2 rounded-lg transition-all active:scale-95"
                                >
                                    {syncing ? '⏳ Syncing...' : '☁️ Sync to Cloud'}
                                </button>
                                <button 
                                    onClick={loadFromCloud}
                                    disabled={syncing}
                                    className="flex-1 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 disabled:opacity-50 text-white font-bold py-2 rounded-lg transition-all active:scale-95"
                                >
                                    {syncing ? '⏳ Loading...' : '📥 Load from Cloud'}
                                </button>
                                <button 
                                    onClick={copyMissingToClipboard}
                                    className="bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-2 px-3 rounded-lg transition-all active:scale-95 text-sm"
                                >
                                    📋 Copy Missing
                                </button>
                            </div>

                            {/* Last Synced */}
                            <div className="text-xs text-slate-600 text-center mb-3">
                                Last synced: {formatSyncTime()}
                            </div>

                            <div className="grid grid-cols-4 gap-2 mb-4">
                                <div className="bg-gradient-to-br from-green-400 to-green-500 rounded-lg p-2 text-white text-center shadow-md">
                                    <div className="text-lg font-bold">{have}</div>
                                    <div className="text-xs font-semibold">Have</div>
                                </div>
                                <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-lg p-2 text-white text-center shadow-md">
                                    <div className="text-lg font-bold">{forTrade}</div>
                                    <div className="text-xs font-semibold">Trading</div>
                                </div>
                                <div className="bg-gradient-to-br from-slate-400 to-slate-500 rounded-lg p-2 text-white text-center shadow-md">
                                    <div className="text-lg font-bold">{missing}</div>
                                    <div className="text-xs font-semibold">Missing</div>
                                </div>
                                <div className="bg-gradient-to-br from-orange-500 to-orange-600 rounded-lg p-2 text-white text-center shadow-md">
                                    <div className="text-lg font-bold">{percentage}%</div>
                                    <div className="text-xs font-semibold">Complete</div>
                                </div>
                            </div>

                            <div className="w-full bg-slate-200 rounded-full h-3 overflow-hidden mb-4">
                                <div className="h-full bg-gradient-to-r from-green-400 via-purple-400 to-orange-400 transition-all" style={{ width: `${percentage}%` }} />
                            </div>

                            <div className="space-y-2">
                                <div className="relative">
                                    <input type="text" placeholder="Search sticker..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-3 pr-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" />
                                </div>

                                <div className="flex gap-2 flex-wrap">
                                    {[{ key: 'all', label: 'All' }, { key: 'have', label: 'Have' }, { key: 'trading', label: 'Trading' }, { key: 'missing', label: 'Missing' }].map(btn => (
                                        <button key={btn.key} onClick={() => setFilterType(btn.key)} className={`px-3 py-1 text-xs font-semibold rounded-full transition-all ${filterType === btn.key ? (btn.key === 'all' ? 'bg-purple-600 text-white' : btn.key === 'have' ? 'bg-green-500 text-white' : btn.key === 'trading' ? 'bg-purple-500 text-white' : 'bg-slate-600 text-white') : 'bg-white border border-slate-300 text-slate-700'}`}>
                                            {btn.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-3xl mx-auto px-3 py-4">
                        {filtered.length === 0 ? (
                            <div className="text-center py-12 text-slate-500">No stickers match</div>
                        ) : (
                            <>
                                {filtered.some(s => s.code.startsWith('FWC')) && (
                                    <div className="mb-8">
                                        <h2 className="text-lg font-bold text-slate-700 uppercase mb-3">⚽ World Cup History</h2>
                                        <div className="grid grid-cols-4 sm:grid-cols-5 gap-2">
                                            {filtered.filter(s => s.code.startsWith('FWC')).sort((a, b) => getStickerNumber(a.code) - getStickerNumber(b.code)).map(s => <StickerCard key={s.code} sticker={s} />)}
                                        </div>
                                    </div>
                                )}

                                {['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'].map(groupKey => {
                                    const groupStickers = filtered.filter(s => GROUPS[groupKey].teams[s.code.split('-')[0]]);
                                    if (groupStickers.length === 0) return null;
                                  const countries = Object.keys(GROUPS[groupKey].teams).filter(code =>
    groupStickers.some(s => s.code.startsWith(code + '-'))
);
                                    return (
                                        <div key={groupKey} className="mb-8">
                                            <h2 className="text-lg font-bold text-slate-700 uppercase mb-4">{GROUPS[groupKey].name}</h2>
                                            {countries.map(code => (
                                                <div key={code} className="mb-5">
                                                    <h3 className="text-sm font-bold text-slate-600 mb-2">🏴 {GROUPS[groupKey].teams[code]}</h3>
                                                    <div className="grid grid-cols-4 sm:grid-cols-5 gap-2">
                                                        {groupStickers.filter(s => s.code.startsWith(code)).sort((a, b) => getStickerNumber(a.code) - getStickerNumber(b.code)).map(s => <StickerCard key={s.code} sticker={s} />)}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    );
                                })}
                            </>
                        )}
                    </div>

                    <div className="fixed bottom-6 right-6 flex flex-col gap-3">
                        <button onClick={() => setTradeMode(true)} className="bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-full p-4 shadow-lg hover:shadow-xl active:scale-95 font-bold text-2xl transition-all">
                            ↔️
                        </button>
                        <button onClick={() => { if (window.confirm('Reset all stickers?')) initializeStickers(); }} className="bg-white border-2 border-slate-300 rounded-full p-3 shadow-lg hover:shadow-xl active:scale-95 transition-all">
                            🔄
                        </button>
                    </div>

                    {tradeMode && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center sm:justify-center">
                            <div className="bg-white w-full sm:max-w-2xl sm:rounded-xl rounded-t-3xl shadow-2xl max-h-[90vh] flex flex-col">
                                <div className="sticky top-0 bg-gradient-to-r from-purple-500 to-purple-600 text-white p-4 flex items-center justify-between rounded-t-3xl sm:rounded-t-xl">
                                    <h2 className="text-2xl font-bold">↔️ Complete a Trade</h2>
                                    <button onClick={() => setTradeMode(false)} className="text-white text-2xl hover:opacity-75">✕</button>
                                </div>

                                <div className="px-4 py-3 border-b bg-slate-50">
                                    <input type="text" placeholder="Search stickers..." value={tradeSearch} onChange={(e) => setTradeSearch(e.target.value)} className="w-full pl-3 pr-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" />
                                </div>

                                <div className="flex-1 overflow-y-auto p-4">
                                    {allStickers.filter(s => s.count >= 2 && s.code.toLowerCase().includes(tradeSearch.toLowerCase())).length === 0 ? (
                                        <div className="text-center py-12 text-slate-500">No stickers available for trading</div>
                                    ) : (
                                        <div className="space-y-3">
                                            {allStickers.filter(s => s.count >= 2 && s.code.toLowerCase().includes(tradeSearch.toLowerCase())).sort((a, b) => a.code.localeCompare(b.code)).map(s => (
                                                <div key={s.code} className="flex items-center justify-between bg-gradient-to-r from-purple-50 to-transparent border-2 border-purple-200 rounded-lg p-4">
                                                    <div className="flex-1">
                                                        <p className="font-bold text-lg">{s.code}</p>
                                                        <p className="text-sm text-slate-600">{getCountryName(s.code.split('-')[0])}</p>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <div className="text-center">
                                                            <p className="text-sm text-slate-600">Available</p>
                                                            <p className="text-2xl font-bold text-purple-600">{s.count - 1}</p>
                                                        </div>
                                                        <button onClick={() => decrementCount(s.code)} className="bg-red-500 hover:bg-red-600 active:scale-95 text-white rounded-lg px-4 py-3 font-bold transition-all">
                                                            Trade ✓
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div className="border-t p-4 bg-slate-50">
                                    <button onClick={() => setTradeMode(false)} className="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 rounded-lg transition-all">
                                        Done
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<PaniniTracker />);
    </script>
</body>
</html>
